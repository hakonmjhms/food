services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cake
      POSTGRES_PASSWORD: cake
      POSTGRES_DB: cake_voting
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://cake:cake@db/cake_voting
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
